<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="ReverseKit banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="55%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, "SF Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1130" cy="60" r="220" fill="#22d3ee" opacity="0.07"/>
  <circle cx="120" cy="300" r="180" fill="#a78bfa" opacity="0.06"/>

  <!-- 左侧标记 -->
  <g transform="translate(72,84)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#0f2136" stroke="url(#accent)" stroke-width="1.6"/>
    <path d="M22 22 L38 36 L22 50" fill="none" stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 50 L54 50" fill="none" stroke="#a78bfa" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <text class="t" x="168" y="128" font-size="60" font-weight="700" fill="#e8f2ff" letter-spacing="1">Reverse<tspan fill="url(#accent)">Kit</tspan></text>
  <text class="t" x="170" y="176" font-size="24" fill="#8fb3d9" letter-spacing="2">逆向 · 渗透 · 二进制攻防　一体化工具集</text>

  <g class="mono" font-size="15" fill="#7dd3fc">
    <rect x="170" y="200" width="152" height="30" rx="7" fill="#0e2438" stroke="#1d4b6e"/>
    <text x="186" y="220">recon  侦察</text>
    <rect x="334" y="200" width="176" height="30" rx="7" fill="#0e2438" stroke="#1d4b6e"/>
    <text x="350" y="220">verify 实证</text>
    <rect x="522" y="200" width="166" height="30" rx="7" fill="#0e2438" stroke="#1d4b6e"/>
    <text x="538" y="220">exploit 利用</text>
    <rect x="700" y="200" width="152" height="30" rx="7" fill="#0e2438" stroke="#1d4b6e"/>
    <text x="716" y="220">patch 补丁</text>
  </g>

  <!-- 右侧装饰：二进制 / 汇编 -->
  <g class="mono" font-size="13" fill="#2f5f88" opacity="0.95">
    <text x="1000" y="120">0x2ad50  stp  x29, x30, [sp,#-0x20]</text>
    <text x="1000" y="144">0x2ad54  adrp x0, #0x61000</text>
    <text x="1000" y="168">0x2ad58  add  x0, x0, #0x3a1</text>
    <text x="1000" y="192">0x2ad5c  bl   #0x2b0e0</text>
    <text x="1000" y="216">0x2ad60  cbnz w0, #0x2adb4</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="1130" cy="262" r="4" fill="#22d3ee"/>
  </g>
  <text class="mono" x="1146" y="267" font-size="13" fill="#4f7fa8">authorized only</text>
</svg>
