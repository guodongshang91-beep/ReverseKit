name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows runner 的 Python stdout 默认 cp1252，打印中文会 UnicodeEncodeError。
# 工具内部已有 UTF-8 护栏（sys.stdout.reconfigure），这里再加一道环境变量双保险。
env:
  PYTHONIOENCODING: utf-8

jobs:
  check:
    name: py${{ matrix.python }} · check.py
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      # 与本地 `python check.py` 完全同一套标准：
      #   1) compileall 全量字节编译
      #   2) 12 个命令行工具 -h 冒烟
      #   3) 真实资产 / 凭据守卫（厂商域名、内网 IP、云 AK、ghp token）
      #   4) pyflakes（非阻断）
      - name: check.py — same standard as local
        run: python check.py

      - name: Real run — PE analysis on a system binary (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: python modules/pe-patch/tools/peck.py info "C:/Windows/System32/notepad.exe" | head -6
